<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS Pencari Fasilitas</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><p class="eyebrow">STUDI KASUS 03</p><h1>Pencari Fasilitas Terdekat</h1><p>Contoh GIS sederhana yang menghitung jarak garis lurus berdasarkan koordinat lintang dan bujur.</p><section class="card"><h2>Koordinat pengguna</h2><div class="fields"><label>Latitude<input id="lat" type="number" step="any" value="-3.8000"></label><label>Longitude<input id="lon" type="number" step="any" value="102.2650"></label></div><button id="find">Cari fasilitas</button></section><section class="card"><h2>Hasil jarak</h2><div id="results" class="list"></div><p class="note">Koordinat fasilitas adalah data contoh. Jarak bukan rute perjalanan di jalan.</p></section></main><script src="script.js"></script></body></html>
